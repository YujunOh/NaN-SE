name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치
        run: pip install -e ".[dev,api]"
      - name: 테스트
        run: python -m pytest -q
      - name: 요구 추적 게이트
        run: nanse trace
