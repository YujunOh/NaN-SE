[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanse"
version = "0.1.0"
description = "바이브코딩에 SW공학 프로세스를 끼워넣는 부드러운 게이트"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13",
    "radon>=6",
]

[project.scripts]
nanse = "nanse.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.30"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["nanse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
