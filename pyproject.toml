[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanse"
version = "0.1.0"
description = "AI 생성 코드의 응집도·복잡도 위반을 결정론적으로 검출하고 학습 카드로 설명한다"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13",
    "radon>=6",
]

[project.scripts]
nanse = "nanse.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.30"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
gemini = ["google-genai>=1"]

[tool.setuptools.packages.find]
include = ["nanse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
